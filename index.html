    /* Top Premium Cyber Bar Indicator */
    .login-box::before {

    @keyframes dynamic-bar {

    .login-box h2 {

    .input-box {

    .input-box input {

      padding: 13px 45px 13px 40px;

      border: 1px solid rgba(255, 255, 255, 0.08);

    .input-box input:focus {

      background: rgba(17, 17, 27, 0.95);

    /* Premium SVG Icons Inside Inputs */
    .input-icon {

    .input-box input:focus ~ .input-icon {

      filter: drop-shadow(0 0 4px rgba(0, 255, 231, 0.5));

    .toggle-password {

    .toggle-password:hover {

    .options {

    .options label {

    .options label:hover {

    }

    .options input[type="checkbox"] {

      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.05);

      transition: all 0.2s ease;
    }

    .options input[type="checkbox"]:checked {

      border-color: #00ffe7;
      box-shadow: 0 0 8px rgba(0, 255, 231, 0.5);
    }

    .options input[type="checkbox"]:checked::before {
      content: '✓';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #000;
      font-size: 11px;

    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(90deg, #00ffe7, #00bfff);
      border: none;
      border-radius: 10px;
      font-size: 16px;

      letter-spacing: 1px;
      color: #000000;
      box-shadow: 0 4px 20px rgba(0, 255, 231, 0.25);
      cursor: pointer;

      overflow: hidden;

    .login-btn:hover {

    /* Premium Neon Pulse Glowing Loader */
    .loading-container {
      display: none;

    @keyframes spin {

    .loading-text {

    /* Decorative corner elements for Cyber/Premium Vibe */

    .top-right { top: 12px; right: 12px; border-top-color: rgba(255,255,255,0.15); border-right-color: rgba(255,255,255,0.15); }
    .bottom-left { bottom: 12px; left: 12px; border-bottom-color: rgba(255,255,255,0.15); border-left-color: rgba(255,255,255,0.15); }
    .bottom-right { bottom: 12px; right: 12px; border-bottom-color: rgba(255,255,255,0.15); border-right-color: rgba(255,255,255,0.15); }

<body>
  <canvas id="particleCanvas"></canvas>

  <div class="center-container">
    <div class="login-box">

      <h2>PREMIUM MODS</h2>

      <form onsubmit="handleLogin(event)">
        <div class="input-box">
          <input type="text" id="username" placeholder="Enter Username" required />
          <!-- User SVG Icon -->
          <svg class="input-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </div>
        <div class="input-box">
          <input type="password" id="password" placeholder="Enter Password" required />
          <!-- Lock SVG Icon -->
          <svg class="input-icon" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
          <!-- Eye SVG Icon for toggling visibility -->
          <svg id="eyeIcon" class="toggle-password" onclick="togglePassword()" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>

<button type="button" class="get-key-btn" onclick="getKey()">GET KEY</button>

  <script>
    function togglePassword() {
      const passField = document.getElementById("password");
      const eyeIcon = document.getElementById("eyeIcon");
      if (passField.type === "password") {
        passField.type = "text";
        // Opened eye path
        eyeIcon.innerHTML = '<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>';
      } else {
        passField.type = "password";
        // Closed eye path (slashed eye)
        eyeIcon.innerHTML = '<path d="M12 7c-2.76 0-5 2.24-5 5 0 .65.13 1.26.36 1.82l2.92-2.92c-.17-.57-.28-1.17-.28-1.9 0-1.66 1.34-3 3-3 .73 0 1.33.11 1.9.28l2.92-2.92C13.26 7.13 12.65 7 12 7zm0 10c2.76 0 5-2.24 5-5 0-.65-.13-1.26-.36-1.82l-2.92 2.92c.17.57.28 1.17.28 1.9 0 1.66-1.34 3-3 3-.73 0-1.33-.11-1.9-.28l-2.92 2.92c.56.23 1.17.36 1.82.36zm10.73-5c-1.73-4.39-6-7.5-11-7.5-.83 0-1.64.09-2.42.26L4.83 2.26 3.5 3.5l17 17 1.33-1.33-2.3-2.3c2.2-1.38 3.96-3.4 5.2-4.87zM12 9.5c1.38 0 2.5 1.12 2.5 2.5 0 .28-.05.54-.15.78l-3.13-3.13c.24-.1.5-.15.78-.15zM2.27 4.73l2.3 2.3C3.19 8.41 1.7 10.19 1 12c1.73 4.39 6 7.5 11 7.5.83 0 1.64-.09 2.42-.26l5.85 5.85 1.33-1.33L3.6 3.4 2.27 4.73z"/>';
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const savePass = document.getElementById("savePass").checked;
      const loadingWrapper = document.getElementById("loadingWrapper");

      loadingWrapper.style.display = "flex";

      setTimeout(() => {
        loadingWrapper.style.display = "none";
        if (window.Android) {
          window.Android.sendData(username, password);
        } else {
          alert("Android interface not available.");
        }
        if (savePass) {
          localStorage.setItem("savedUser", username);
          localStorage.setItem("savedPass", password);
        }
      }, 2000);
    }

    window.onload = () => {
      const savedUser = localStorage.getItem("savedUser");
      const savedPass = localStorage.getItem("savedPass");
      if (savedUser && savedPass) {
        document.getElementById("username").value = savedUser;
        document.getElementById("password").value = savedPass;
        document.getElementById("savePass").checked = true;
      }
    };

    // Advanced Matrix/Glow Line Smooth Floating Particles
    const canvas = document.getElementById("particleCanvas");
    const ctx = canvas.getContext("2d");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const particleCount = 65;
    const particles = [];

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 1;
        this.speedX = Math.random() * 0.8 - 0.4;
        this.speedY = Math.random() * 0.8 - 0.4;
        this.color = Math.random() > 0.5 ? '#00ffe7' : '#ff0055';
        this.alpha = Math.random() * 0.5 + 0.2;
      }

      update() {
        this.x += this.speedX;
        this.y += this.speedY;

        if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
        if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.fillStyle = this.color;
        
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < particleCount; i++) {
      particles.push(new Particle());
    }

    function connectParticles() {
      for (let a = 0; a < particles.length; a++) {
        for (let b = a; b < particles.length; b++) {
          const dx = particles[a].x - particles[b].x;
          const dy = particles[a].y - particles[b].y;
          const distance = Math.sqrt(dx * dx + dy * dy);

          if (distance < 100) {
            ctx.save();
            // Gradient lines between particles
            let opacity = (1 - (distance / 100)) * 0.15;
            ctx.strokeStyle = particles[a].color;
            ctx.globalAlpha = opacity;
            ctx.lineWidth = 0.5;
            ctx.beginPath();
            ctx.moveTo(particles[a].x, particles[a].y);
            ctx.lineTo(particles[b].x, particles[b].y);
            ctx.stroke();
            ctx.restore();
          }
        }
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let particle of particles) {
        particle.update();
        particle.draw();
      }
      
      connectParticles();
      requestAnimationFrame(animate);
    }

    animate();

    window.addEventListener("resize", function () {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  
function getKey(){

}

</script>
